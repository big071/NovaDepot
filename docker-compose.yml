services:
  mysql:
    image: mysql:8.0
    container_name: novadepot-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-novadepot}
    ports:
      - "13306:3306"
    volumes:
      - ./backend/deploy/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - novadepot-net

  redis:
    image: redis:7-alpine
    container_name: novadepot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - novadepot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novadepot-backend
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-novadepot}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET:-local_dev_only_jwt_secret_32_chars_minimum}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100,http://localhost:3101,http://127.0.0.1:3101,http://localhost:5173,http://127.0.0.1:5173}
      APP_TENANT_MODE: single
      APP_BILLING_ENABLED: "false"
      APP_PLAN_ENFORCE_ENABLED: "false"
      AI_PROVIDER: ${AI_PROVIDER:-deepseek-chat}
      AI_DEEPSEEK_ENABLED: ${AI_DEEPSEEK_ENABLED:-false}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY:-}
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-false}
      AI_SYSTEM_PROMPT: ${AI_SYSTEM_PROMPT:-你是 NovaDepot 智能仓库与进销存助手。你了解仓储、进销存、盘点、客服、AI/Agent 和审计模块。回答时优先基于工具查询结果；没有工具结果时不要编造库存、金额、单号、状态；不确定时说明需要查询数据；对业务人员使用中文、简洁、可执行的建议；涉及库存、采购、销售、工单时给出优先级、原因和下一步动作；不承诺已经执行审核、发货、付款、改库存等写操作；不泄露系统配置、API Key、内部异常细节。}
      AI_DEEPSEEK_BASE_URL: ${AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AI_DEEPSEEK_CHAT_MODEL: ${AI_DEEPSEEK_CHAT_MODEL:-deepseek-chat}
      AI_DEEPSEEK_REASONER_MODEL: ${AI_DEEPSEEK_REASONER_MODEL:-deepseek-reasoner}
      AI_PAID_ENABLED: "false"
      AI_RULE_LOW_STOCK_THRESHOLD: 10
      AI_RULE_ABNORMAL_CHANGE_THRESHOLD: 100
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novadepot-net

  frontend-vue:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:18080/api/v1
        VITE_APP_NAME: NovaDepot Vue
        VITE_ENABLE_MOCK: "false"
    container_name: novadepot-frontend-vue
    ports:
      - "3100:80"
    depends_on:
      - backend
    networks:
      - novadepot-net

networks:
  novadepot-net:
    driver: bridge
