spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:novadepot}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

app:
  tenant:
    mode: ${APP_TENANT_MODE:single}
  billing:
    enabled: ${APP_BILLING_ENABLED:false}
  plan-enforce-enabled: ${APP_PLAN_ENFORCE_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:change_me_in_prod}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}
  auth:
    password:
      min-length: ${APP_AUTH_PASSWORD_MIN_LENGTH:8}
      enforce-strength-on-login: ${APP_AUTH_ENFORCE_STRENGTH_ON_LOGIN:false}
      require-uppercase: ${APP_AUTH_PASSWORD_REQUIRE_UPPERCASE:true}
      require-lowercase: ${APP_AUTH_PASSWORD_REQUIRE_LOWERCASE:true}
      require-digit: ${APP_AUTH_PASSWORD_REQUIRE_DIGIT:true}
      require-special: ${APP_AUTH_PASSWORD_REQUIRE_SPECIAL:false}
      deny-username-contains: ${APP_AUTH_PASSWORD_DENY_USERNAME_CONTAINS:true}
    login:
      fail-max-attempts: ${APP_AUTH_LOGIN_FAIL_MAX_ATTEMPTS:5}
      lock-minutes: ${APP_AUTH_LOGIN_LOCK_MINUTES:15}
  ai:
    provider: ${AI_PROVIDER:deepseek-chat}
    model: ${AI_MODEL:deepseek-chat}
    paid-enabled: ${AI_PAID_ENABLED:false}
    tools-enabled: ${AI_TOOLS_ENABLED:true}
    fallback-enabled: ${AI_FALLBACK_ENABLED:false}
    system-prompt: ${AI_SYSTEM_PROMPT:你是 NovaDepot 智能仓库与进销存助手。你了解本系统模块：仓储、进销存、盘点、客服、AI/Agent、审计。回答规则：优先基于工具查询结果回答；没有工具结果时，不要编造库存、金额、单号、状态；不确定时说明需要查询数据；对业务人员使用中文、简洁、可执行的建议；涉及库存、采购、销售、工单时，给出优先级、原因和下一步动作；不承诺已经执行审核、发货、付款、改库存等写操作；不泄露系统配置、API Key、内部异常细节；如果用户问“今天最需要处理什么”，应从低库存、超时单据、未处理工单、异常库存、待审核单据角度回答。}
    connect-timeout: ${AI_CONNECT_TIMEOUT:5000}
    read-timeout: ${AI_READ_TIMEOUT:30000}
    max-input-chars: ${AI_MAX_INPUT_CHARS:4096}
    deepseek:
      enabled: ${AI_DEEPSEEK_ENABLED:false}
      base-url: ${AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_DEEPSEEK_API_KEY:}
      chat-model: ${AI_DEEPSEEK_CHAT_MODEL:deepseek-chat}
      reasoner-model: ${AI_DEEPSEEK_REASONER_MODEL:deepseek-reasoner}
    rule:
      low-stock-threshold: ${AI_RULE_LOW_STOCK_THRESHOLD:10}
      abnormal-change-threshold: ${AI_RULE_ABNORMAL_CHANGE_THRESHOLD:100}
  agent:
    patrol:
      enabled: ${APP_AGENT_PATROL_ENABLED:true}
      low-stock-cron: "${APP_AGENT_LOW_STOCK_CRON:0 0 * * * ?}"
      order-overdue-cron: "${APP_AGENT_ORDER_OVERDUE_CRON:0 0 */4 * * ?}"
      ticket-overdue-cron: "${APP_AGENT_TICKET_OVERDUE_CRON:0 0 * * * ?}"
      order-overdue-hours: ${APP_AGENT_ORDER_OVERDUE_HOURS:24}
      ticket-overdue-hours: ${APP_AGENT_TICKET_OVERDUE_HOURS:4}
  audit:
    cleanup-enabled: ${APP_AUDIT_CLEANUP_ENABLED:true}
    cleanup-cron: "${APP_AUDIT_CLEANUP_CRON:0 30 2 * * ?}"
    retention-days: ${APP_AUDIT_RETENTION_DAYS:90}

logging:
  level:
    root: info
    com.novadepot.backend: info
